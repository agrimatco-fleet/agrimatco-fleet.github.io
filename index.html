<script>
'use strict';
/* ===== إعدادات Firebase (من google-services.json في تطبيق أندرويد) ===== */
const API_KEY = 'AIzaSyCLDwNeAXpFOgTOdVz2YYXCwRe9AiTz2nI';
const DB_URL  = 'https://agrimatico-fleet-default-rtdb.europe-west1.firebasedatabase.app';

/* ===== أدوات عامة ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const fmt = d => d % 1 === 0 ? String(d) : d.toFixed(1);
const dur = ms => { const m = Math.floor(Math.max(0, ms) / 60000), h = Math.floor(m / 60); return h > 0 ? `${h} س ${m % 60} د` : `${m} د`; };
const timeStr = t => { const d = new Date(t); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
/** يقبل الأرقام العربية ٠-٩ والفاصلة العربية */
const fmtNum = d => d % 1 === 0 ? String(d) : d.toFixed(2);
const num = s => { const t = String(s||'').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,]/g, '.').trim(); return t === '' || isNaN(+t) ? null : +t; };
let toastT; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

function dlg({ title, msg, body, ok = 'حفظ', cancel = 'إلغاء', onOk }) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">${title ? `<h3>${esc(title)}</h3>` : ''}<div class="msg">${esc(msg || '')}</div><div class="b"></div><div class="row"><button class="no">${esc(cancel)}</button><button class="ok">${esc(ok)}</button></div></div>`;
  if (body) bg.querySelector('.b').append(...body);
  const close = () => bg.remove();
  bg.querySelector('.no').onclick = close;
  bg.querySelector('.ok').onclick = () => { if (!onOk || onOk(close) !== false) close(); };
  document.body.append(bg);
  return close;
}
const mkInput = (ph, o = {}) => { const i = document.createElement(o.area ? 'textarea' : 'input'); i.placeholder = ph; if (o.num) i.setAttribute('inputmode', 'decimal'); if (o.val != null) i.value = o.val; if (o.area) i.rows = 2; return i; };

/* ===== التخزين المحلي (مثل Store.kt): إعدادات + بيانات في localStorage، والصور في IndexedDB ===== */
const jget = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
let S = jget('fleet_s', {});
let D = Object.assign({ points: [], invoices: [], deletions: [], trips: [] }, jget('fleet_d', {}));
const saveS = () => localStorage.setItem('fleet_s', JSON.stringify(S));
const saveD = () => localStorage.setItem('fleet_d', JSON.stringify(D));
const PROFILE_KEYS = ['name', 'phone', 'carType', 'model', 'color', 'plate', 'vin'];
const prof = k => S['p_' + k] || '';
const configured = () => !!(S.uid && S.rt);
const profileDone = () => PROFILE_KEYS.every(k => prof(k).trim()) && !!S.hasAvatar;
const dirty = () => (S.rev || 0) > (S.srev || 0);
const touch = () => { S.rev = (S.rev || 0) + 1; saveS(); };
const pendingChanges = () => Math.max(0, (S.rev || 0) - (S.srev || 0));
const pendingInvoices = () => D.invoices.filter(i => !i.up || (i.file2 && !i.up2)).length;
const pendingDeletions = () => D.deletions.filter(i => !i.up).length;
const activeTrip = () => [...D.trips].reverse().find(t => !t.endTime) || null;
const allPts = () => [...D.points].sort((a, b) => a.time - b.time);

const idb = new Promise((res, rej) => { const r = indexedDB.open('fleet', 1); r.onupgradeneeded = () => r.result.createObjectStore('img'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const idbReq = (mode, fn) => idb.then(db => new Promise((res, rej) => { const q = fn(db.transaction('img', mode).objectStore('img')); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }));
const imgGet = k => idbReq('readonly', s => s.get(k));
const imgSet = (k, v) => idbReq('readwrite', s => s.put(v, k));
const imgDel = k => idbReq('readwrite', s => s.delete(k));
const imgClear = () => idbReq('readwrite', s => s.clear());
const dataUrl = b64 => b64 ? 'data:image/jpeg;base64,' + b64 : '';

/** تصغير الصورة (فاتورة: أطول ضلع 1280، جودة 65٪ — شخصية: مربع 256) مع احترام اتجاه EXIF */
function toB64(file, { max = 1280, q = .65, square = 0 } = {}) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(u);
      let sw = im.naturalWidth, sh = im.naturalHeight, sx = 0, sy = 0, w, h;
      if (square) { const s = Math.min(sw, sh); sx = (sw - s) / 2; sy = (sh - s) / 2; sw = sh = s; w = h = square; }
      else { const k = Math.min(1, max / Math.max(sw, sh)); w = Math.round(sw * k); h = Math.round(sh * k); }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(im, sx, sy, sw, sh, 0, 0, w, h);
      res(c.toDataURL('image/jpeg', q).split(',')[1]);
    };
    im.onerror = () => rej(new Error('تعذّر قراءة الصورة'));
    im.src = u;
  });
}
function pickImage(camera) {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
    if (camera) i.setAttribute('capture', 'environment');
    i.onchange = () => res(i.files[0] || null);
    i.click();
  });
}

/* ===== الاتصال بـ Firebase عبر REST (مثل Cloud.kt) ===== */
async function call(method, url, body, ct) {
  const r = await fetch(url, { method, headers: ct ? { 'Content-Type': ct } : {}, body: body ?? undefined });
  const t = await r.text();
  if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + t);
  return t;
}
const signIn = (email, password) => call('POST', `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${API_KEY}`,
  JSON.stringify({ email, password, returnSecureToken: true }), 'application/json').then(JSON.parse);
const refreshToken = () => call('POST', `https://securetoken.googleapis.com/v1/token?key=${API_KEY}`,
  'grant_type=refresh_token&refresh_token=' + encodeURIComponent(S.rt), 'application/x-www-form-urlencoded').then(t => JSON.parse(t).id_token);

/* ===== المزامنة (مثل Syncer.kt) ===== */
class Disabled extends Error {}
class AuthGone extends Error {}
let syncing = false, again = false, disabled = false, authGone = false, lastErr = '';
const GONE_MSG = 'انتهت صلاحية الحساب على هذا الجهاز (الحساب محذوف أو أُعيد إنشاؤه). سجّل الخروج ثم ادخل من جديد.';

async function doSync() {
  const uid = S.uid, dels = D.deletions, invs = D.invoices;
  let token;
  try { token = await refreshToken(); }
  catch (e) { if (/USER_NOT_FOUND|TOKEN_EXPIRED|INVALID_REFRESH_TOKEN|USER_DISABLED/.test(e.message || '')) throw new AuthGone(); throw e; }
  const dr = (await call('GET', `${DB_URL}/drivers/${uid}.json?auth=${token}`)).trim();
  const d = dr === 'null' ? null : JSON.parse(dr);
  if (!d || !d.active) throw new Disabled();
  S.driverName = d.name || ''; S.vehicle = d.vehicle || ''; saveS();

  // رحلات/فواتير حذفها المدير
  try {
    const rm = (await call('GET', `${DB_URL}/removed/${uid}.json?auth=${token}`)).trim();
    if (rm !== 'null') await applyRemoved(new Set(Object.keys(JSON.parse(rm)).map(Number)));
  } catch (e) { if (!/^HTTP 40[13]/.test(e.message)) throw e; }

  // تقارير حذف النقاط أولاً
  for (const o of dels) {
    if (o.up) continue;
    const url = `${DB_URL}/deletions/${uid}/${o.id}.json?auth=${token}`;
    if ((await call('GET', url)).trim() === 'null') { const b = { ...o }; delete b.up; await call('PUT', url, JSON.stringify(b)); }
    o.up = true; saveD();
  }
  // صورة السائق
  const av = await imgGet('avatar');
  if (av && !S.photoUp) { await call('PUT', `${DB_URL}/avatars/${uid}.json?auth=${token}`, JSON.stringify(av)); S.photoUp = true; saveS(); }

  const pts = {}, trips = {}, invNode = {};
  D.points.forEach(p => pts[p.id] = p);
  D.trips.forEach(t => trips[t.id] = t);
  for (const o of invs) {
    const b = await imgGet('inv_' + o.id);
    if (!o.up && b) { await call('PUT', `${DB_URL}/images/${uid}/${o.id}.json?auth=${token}`, JSON.stringify(b)); o.up = true; saveD(); }
    if (o.file2 && !o.up2) {
      const b2 = await imgGet('inv_' + o.id + '_2');
      if (b2) await call('PUT', `${DB_URL}/images/${uid}/${o.id}_2.json?auth=${token}`, JSON.stringify(b2));
      o.up2 = true; saveD();
    }
    invNode[o.id] = { id: o.id, note: o.note || '', amount: o.amount || '', time: o.time,
      cat: o.cat || '', ppl: o.ppl || '', liters: o.liters || '', fault: o.fault || '', img2: !!o.file2 };
  }
  const profile = {}; PROFILE_KEYS.forEach(k => profile[k] = prof(k));
  const node = { name: S.driverName, vehicle: S.vehicle, lastSync: Date.now(), photoTime: av ? (S.photoTime || 0) : 0, points: pts, trips, invoices: invNode, profile };
  await call('PUT', `${DB_URL}/data/${uid}.json?auth=${token}`, JSON.stringify(node));
}
async function applyRemoved(ids) {
  if (!ids.size) return;
  const np = D.points.filter(p => !ids.has(p.tripId)), nt = D.trips.filter(t => !ids.has(t.id));
  const gone = D.invoices.filter(o => ids.has(o.id)), ni = D.invoices.filter(o => !ids.has(o.id));
  for (const o of gone) { await imgDel('inv_' + o.id); await imgDel('inv_' + o.id + '_2'); }
  if (np.length !== D.points.length || nt.length !== D.trips.length || ni.length !== D.invoices.length) { D.points = np; D.trips = nt; D.invoices = ni; saveD(); }
}
async function syncNow(force) {
  if (!force && !dirty()) return 'OK';
  const rev0 = S.rev || 0;
  try { await doSync(); S.srev = Math.max(S.srev || 0, rev0); S.lastSync = Date.now(); saveS(); disabled = false; authGone = false; return 'OK'; }
  catch (e) { if (e instanceof AuthGone) { authGone = true; return 'GONE'; } if (e instanceof Disabled) { disabled = true; return 'DISABLED'; } lastErr = e.message || String(e); return 'RETRY'; }
}
/** مزامنة واحدة في كل مرة؛ إن وصلت تعديلات أثناءها تُعاد مرة أخرى */
async function runSync(force = true, cb) {
  if (syncing) { again = true; cb && cb('مزامنة أخرى جارية، ستُرسل التعديلات تلقائياً'); return; }
  syncing = true; let msg, f = force;
  do {
    again = false;
    const r = await syncNow(f);
    msg = r === 'OK' ? 'تمت المزامنة بنجاح ✓' : r === 'GONE' ? GONE_MSG : r === 'DISABLED' ? 'الحساب معطّل' : 'فشلت المزامنة: ' + lastErr;
    f = false;
  } while (again);
  syncing = false; cb && cb(msg); refreshBanners();
}
/** بعد كل تعديل: يدخل الطابور ويُرسل فوراً إن أمكن، وإلا عند عودة الإنترنت/فتح التطبيق */
function autoSync() {
  if (!configured()) return;
  touch();
  runSync(false, m => toast(m.includes('✓') ? 'تمت المزامنة ✓' : m.includes('معطّل') ? 'الحساب معطّل، راجع المدير' : m === GONE_MSG ? 'الحساب غير موجود، سجّل الخروج وادخل من جديد' : 'حُفظ على الهاتف وسيُرسل عند توفر الإنترنت'));
}
function kick() { if (configured() && dirty() && navigator.onLine) runSync(false); }
addEventListener('online', kick);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') kick(); });
setInterval(() => { if (document.visibilityState === 'visible') kick(); }, 30000);

/* ===== شريط حالة الإرسال ===== */
function bannerHTML() {
  if (!configured()) return '';
  if (authGone) return `<div class="banner bad" data-banner>⚠ ${GONE_MSG}</div>`;
  if (disabled) return `<div class="banner bad" data-banner>⚠ الحساب معطّل — بياناتك محفوظة على الهاتف، راجع المدير</div>`;
  if (dirty()) {
    const inv = pendingInvoices(), del = pendingDeletions();
    return `<div class="banner wait" data-banner>⏳ ${pendingChanges()} تعديل بانتظار الإرسال${inv ? ` — ${inv} فاتورة` : ''}${del ? ` — ${del} تقرير حذف` : ''}\nمحفوظة على الهاتف وتُرسل تلقائياً عند توفر الإنترنت</div>`;
  }
  return `<div class="banner ok" data-banner>✓ كل البيانات مرسلة${S.lastSync ? ` — آخر مزامنة ${timeStr(S.lastSync)}` : ''}</div>`;
}
function refreshBanners() { document.querySelectorAll('[data-banner]').forEach(b => { const t = document.createElement('div'); t.innerHTML = bannerHTML(); b.replaceWith(t.firstChild || document.createComment('')); }); }
setInterval(refreshBanners, 2000);

/* ===== التحديث التلقائي للتطبيق ===== */
let updatePending = false;
/** هل يوجد عمل غير محفوظ على الشاشة (نموذج فاتورة/بيانات أو نافذة مفتوحة)؟ */
function formBusy() {
  if (document.querySelector('.modal-bg') || syncing) return true;
  if (view === 'profile') return true;
  if (view === 'inv') return [...host.querySelectorAll('input')].some(i => i.value) || !!host.querySelector('.prev[src]');
  return false;
}
function applyUpdate() {
  if (formBusy()) { updatePending = true; toast('يوجد تحديث جديد، سيُطبَّق عند التنقل بين الشاشات'); return; }
  toast('جارٍ تحديث التطبيق…'); setTimeout(() => location.reload(), 800);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && updatePending && !formBusy()) location.reload(); });

/* ===== التنقل ===== */
let tab = 'trip', view = 'trip';
const host = $('#host');
function setChrome(on) { $('#header').style.display = on ? '' : 'none'; $('#nav').style.display = on ? '' : 'none'; }
function go(v) {
  if (updatePending) { location.reload(); return; }
  if (!configured()) return showLogin();
  if ((v === 'trip' || v === 'inv') && !profileDone()) v = 'profile';
  view = v; if (v !== 'profile') tab = v;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  host.scrollTop = 0;
  ({ trip: renderTrip, inv: renderInv, sync: renderSync, profile: renderProfile })[v]();
}
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => go(b.dataset.t));
const page = html => { host.innerHTML = `<div class="holder"><div class="card">${bannerHTML()}${html}</div></div>`; return host.firstChild.firstChild; };

/* ===== تسجيل الدخول ===== */
function showLogin() { setChrome(false); $('#login').style.display = 'block'; }
function hideLogin() { $('#login').style.display = 'none'; setChrome(true); }
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
if (isIOS && !standalone) $('#iosTip').style.display = 'block';
$('#lshow').onchange = e => $('#lp').type = e.target.checked ? 'text' : 'password';
$('#lp').onkeydown = e => { if (e.key === 'Enter') submitLogin(); };
$('#lgo').onclick = submitLogin;

async function performLogin(user, pw) {
  try {
    const r = await signIn(user.trim().toLowerCase() + '@fleet.local', pw);
    const uid = r.localId, tok = r.idToken;
    const dr = (await call('GET', `${DB_URL}/drivers/${uid}.json?auth=${tok}`)).trim();
    if (dr === 'null') throw new Error('INACTIVE');
    const d = JSON.parse(dr); if (!d.active) throw new Error('INACTIVE');
    S.uid = uid; S.rt = r.refreshToken; S.username = user.trim(); S.driverName = d.name || ''; S.vehicle = d.vehicle || ''; saveS();
    // استرجاع بيانات السائق وصورته إن أدخلها سابقاً
    try {
      const pr = (await call('GET', `${DB_URL}/data/${uid}/profile.json?auth=${tok}`)).trim();
      if (pr !== 'null') { const j = JSON.parse(pr); PROFILE_KEYS.forEach(k => S['p_' + k] = j[k] || ''); }
      const av = (await call('GET', `${DB_URL}/avatars/${uid}.json?auth=${tok}`)).trim();
      if (av !== 'null' && !(await imgGet('avatar'))) { await imgSet('avatar', JSON.parse(av)); S.hasAvatar = true; S.photoUp = true; S.photoTime = Date.now(); }
      saveS();
    } catch {}
    return null;
  } catch (e) {
    const m = e.message || '';
    if (e instanceof TypeError) return 'تعذّر الاتصال بالإنترنت، تحقق من الشبكة';
    if (m.includes('INVALID') || m.includes('EMAIL_NOT_FOUND')) return 'اسم المستخدم أو كلمة المرور غير صحيحة';
    if (m.includes('INACTIVE')) return 'الحساب غير مفعّل، راجع المدير';
    if (m.includes('TOO_MANY')) return 'محاولات كثيرة، حاول بعد قليل';
    return 'تعذّر الدخول: ' + m;
  }
}
async function submitLogin() {
  const u = $('#lu').value, p = $('#lp').value, st = $('#lst'), btn = $('#lgo');
  if (!u.trim() || !p) { st.textContent = 'أكمل كل الحقول'; return; }
  st.textContent = ''; btn.disabled = true; btn.textContent = 'جارٍ الدخول...';
  const err = await performLogin(u, p);
  if (err) { st.textContent = err; btn.disabled = false; btn.textContent = 'تسجيل الدخول'; return; }
  btn.disabled = false; btn.textContent = 'تسجيل الدخول'; $('#lp').value = '';
  hideLogin(); go('trip'); runSync(true);
}

/* ===== تبويب الرحلة ===== */
function confirmSave(odo, prev, ok) {
  dlg({ title: 'تأكيد قراءة العداد', ok: 'حفظ', cancel: 'مراجعة', onOk: () => { ok(); },
    msg: `القراءة: ${fmt(odo)} كم${prev != null ? `\nالمسافة منذ آخر قراءة: ${fmt(odo - prev)} كم` : ''}\n\nلا يمكن حذف النقطة. إن أخطأت يمكنك تصحيح العداد لاحقاً بسبب يصل للمدير، فتأكد من الرقم.` });
}
function editOdo(p) {
  const pts = allPts(), idx = pts.findIndex(x => x.id === p.id);
  const lo = pts[idx - 1]?.odo ?? null, hi = pts[idx + 1]?.odo ?? null, oldV = p.odo;
  const et = mkInput('قراءة العداد الصحيحة', { num: 1, val: fmt(oldV) }), rs = mkInput('سبب التصحيح (إجباري)', { area: 1 });
  const range = `من ${lo != null ? fmt(lo) : 'أي قيمة'} إلى ${hi != null ? fmt(hi) : 'أي قيمة'}`;
  dlg({ title: 'تصحيح العداد: ' + p.name, msg: `القراءة الحالية: ${fmt(oldV)}\nالمسموح: ${range}\nيُرسل التصحيح للمدير مع السبب.`, body: [et, rs], ok: 'حفظ التصحيح',
    onOk: () => {
      et.classList.remove('err'); rs.classList.remove('err');
      const v = num(et.value), r = rs.value.trim();
      if (v == null) { et.classList.add('err'); toast('أدخل رقماً'); return false; }
      if ((lo != null && v < lo) || (hi != null && v > hi)) { et.classList.add('err'); toast('يجب أن تكون ' + range); return false; }
      if (v === oldV) return true;
      if (r.length < 3) { rs.classList.add('err'); toast('اكتب سبب التصحيح'); return false; }
      (p.editLog = p.editLog || []).push({ from: oldV, to: v, time: Date.now(), reason: r });
      p.odo = v;
      const t = D.trips.find(t => t.id === p.tripId);
      if (t) { if (p.kind === 'start') t.startOdo = v; else if (p.kind === 'end') t.endOdo = v; }
      afterTrip();
    } });
}
function afterTrip() { saveD(); renderTrip(); autoSync(); }
const mkPoint = (id, name, odo, kind, tripId) => ({ id, name, odo, time: id, kind, tripId });

function pointRow(idx, p, prev, tripActive) {
  const seg = prev ? Math.max(0, p.odo - prev.odo) : 0;
  const icon = { start: '🟢 انطلاق', end: '🏁 نهاية', stop: '📍 توقف' }[p.kind] || '📍';
  const extra = prev ? `  (+${fmt(seg)} كم)` : '';
  let d = '';
  if (p.kind === 'stop') {
    if (p.leave > 0) d = `\n⏱ مدة التوقف: ${dur(p.leave - p.time)}`;
    else if (tripActive) d = `\n⏱ متوقف حالياً منذ ${dur(Date.now() - p.time)}`;
  }
  return `<div class="pt" data-pt="${p.id}">${idx + 1}. ${icon} — ${esc(p.name)} — ${fmt(p.odo)}${p.editLog ? ' ✏' : ''}${extra}\n${timeStr(p.time)}${d}</div>`;
}

function renderTrip() {
  const all = allPts(), trip = activeTrip(), now = Date.now();
  const lastOdo = all.length ? all[all.length - 1].odo : null;
  const hint = lastOdo != null ? `قراءة العداد (لا تقل عن ${fmt(lastOdo)})` : 'قراءة العداد (كم)';
  let h = '';
  if (!trip) {
    h += `<div class="lbl b" style="font-size:20px">لا توجد رحلة جارية</div>
      <input id="nm" placeholder="نقطة الانطلاق"><input id="od" inputmode="decimal" placeholder="${esc(hint)}">
      <button class="btn" id="bStart">▶ بدء رحلة</button>`;
  } else {
    const tid = trip.id, tp = all.filter(p => p.tripId === tid);
    const open = [...tp].reverse().find(p => p.kind === 'stop' && !p.leave);
    h += `<div class="lbl b" style="font-size:20px">🚚 رحلة جارية</div>
      <div class="lbl">بدأت ${timeStr(trip.startTime)} — مضى ${dur(now - trip.startTime)}</div>`;
    if (open) h += `<div class="lbl b">أنت متوقف الآن في «${esc(open.name)}» منذ ${dur(now - open.time)}</div><button class="btn" id="bLeave">➡ مغادرة النقطة</button>`;
    h += `<input id="nm" placeholder="اسم نقطة التوقف (أو نقطة النهاية)"><input id="od" inputmode="decimal" placeholder="${esc(hint)}">
      <button class="btn" id="bStop">📍 تسجيل نقطة توقف</button><button class="btn" id="bEnd">🏁 إنهاء الرحلة</button>`;
  }
  // سجل الرحلات
  const trips = [...D.trips].sort((a, b) => b.startTime - a.startTime);
  for (const t of trips) {
    const active = !t.endTime, tp = all.filter(p => p.tripId === t.id), stops = tp.filter(p => p.kind === 'stop');
    const stopMs = stops.reduce((s, p) => s + ((p.leave > 0 ? p.leave : active ? now : p.time) - p.time), 0);
    const endOdo = !active ? t.endOdo : (tp.length ? tp[tp.length - 1].odo : t.startOdo);
    h += `<div class="lbl b" style="font-size:17px;padding-top:16px">— رحلة ${timeStr(t.startTime)} ${active ? '(جارية)' : ''}</div>
      <div class="lbl" style="font-size:14px">المدة: ${dur((active ? now : t.endTime) - t.startTime)}   |   المسافة: ${fmt(Math.max(0, endOdo - t.startOdo))} كم\nالتوقفات: ${stops.length}   |   مجموع وقت التوقف: ${dur(stopMs)}</div>`;
    tp.forEach((p, i) => h += pointRow(i, p, tp[i - 1], active));
  }
  const legacy = all.filter(p => !p.tripId);
  if (legacy.length) { h += `<div class="lbl b" style="font-size:17px;padding-top:16px">— نقاط سابقة (بدون رحلة)</div>`; legacy.forEach((p, i) => h += pointRow(i, p, legacy[i - 1], false)); }
  h += `<div class="lbl" style="font-size:12px">النقاط لا تُحذف. لتصحيح خطأ في العداد اضغط على النقطة (✏ = نقطة مصحّحة، والتصحيح يصل للمدير مع السبب). العداد لا يقل عن القراءة السابقة.</div>`;
  const root = page(h);

  root.querySelectorAll('[data-pt]').forEach(e => e.onclick = () => editOdo(D.points.find(p => p.id == e.dataset.pt)));
  const valid = o => {
    if (o == null) { toast('أدخل قراءة العداد'); return false; }
    if (lastOdo != null && o < lastOdo) { toast(`القراءة (${fmt(o)}) أقل من آخر قراءة مسجّلة (${fmt(lastOdo)})`); return false; }
    return true;
  };
  const val = () => ({ n: $('#nm').value.trim(), o: num($('#od').value) });
  const on = (id, f) => { const b = root.querySelector(id); if (b) b.onclick = f; };
  on('#bStart', () => {
    const { n, o } = val();
    if (!n || o == null) return toast('أدخل نقطة الانطلاق وقراءة العداد');
    if (!valid(o)) return;
    confirmSave(o, lastOdo, () => {
      const t = Date.now();
      D.trips.push({ id: t, startTime: t, startOdo: o, endTime: 0, endOdo: 0 });
      D.points.push(mkPoint(t, n, o, 'start', t)); afterTrip();
    });
  });
  on('#bLeave', () => { const open = [...all].reverse().find(p => p.tripId === trip.id && p.kind === 'stop' && !p.leave); if (open) open.leave = Date.now(); afterTrip(); });
  on('#bStop', () => {
    const { n, o } = val(); if (!valid(o)) return;
    if (!n) return toast('أدخل اسم النقطة');
    confirmSave(o, lastOdo, () => {
      const t = Date.now(), open = [...all].reverse().find(p => p.tripId === trip.id && p.kind === 'stop' && !p.leave);
      if (open) open.leave = t; // مغادرة النقطة السابقة تلقائياً
      D.points.push(mkPoint(t + 1, n, o, 'stop', trip.id)); afterTrip();
    });
  });
  on('#bEnd', () => {
    const { n, o } = val(); if (!valid(o)) return;
    confirmSave(o, lastOdo, () => {
      const t = Date.now(), open = [...all].reverse().find(p => p.tripId === trip.id && p.kind === 'stop' && !p.leave);
      if (open) open.leave = t;
      D.points.push(mkPoint(t + 1, n || 'نهاية الرحلة', o, 'end', trip.id));
      trip.endTime = t; trip.endOdo = o; afterTrip();
    });
  });
}

/* ===== تبويب الفواتير ===== */
const invDetail = o => o.cat === 'fuel' ? `⛽ بانزين\nسعر اللتر: ${esc(o.ppl)} — الكمية: ${esc(o.liters)} لتر\nالمجموع: ${esc(o.amount)}`
  : o.cat === 'maint' ? `🔧 صيانة\nالعطل: ${esc(o.fault)}\nالمبلغ: ${esc(o.amount)}`
  : `${esc(o.note)}\nالمبلغ: ${esc(o.amount)}`;

async function renderInv() {
  let cat = 'fuel', b1 = null, b2 = null;
  const slot = (n, title) => `<div class="lbl b">${title}</div><img class="prev" id="pv${n}" alt="" style="display:none">
    <div class="two"><button class="btn" id="c${n}">📷 تصوير</button><button class="btn" id="g${n}">🖼 معرض</button></div>`;
  const root = page(`<div class="lbl b" style="font-size:20px">فاتورة جديدة</div>
    <div class="cats"><button type="button" class="cat on" data-c="fuel">⛽ بانزين</button><button type="button" class="cat" data-c="maint">🔧 صيانة</button><button type="button" class="cat" data-c="other">📝 أخرى</button></div>
    <div id="fBox"><input id="ppl" inputmode="decimal" placeholder="سعر اللتر"><input id="ltr" inputmode="decimal" placeholder="عدد اللترات"></div>
    <div id="mBox" style="display:none"><input id="flt" placeholder="ما هو العطل؟"></div>
    <div id="oBox" style="display:none"><input id="note" placeholder="ملاحظة"></div>
    <input id="amt" inputmode="decimal" placeholder="المجموع (يُحسب تلقائياً)">
    ${slot(1, 'الصورة 1 (إلزامية)')}${slot(2, 'الصورة 2 (اختيارية)')}
    <button class="btn" id="bSave">حفظ الفاتورة</button><div id="list"></div>`);
  const q = s => root.querySelector(s);

  const showCat = () => {
    q('#fBox').style.display = cat === 'fuel' ? '' : 'none';
    q('#mBox').style.display = cat === 'maint' ? '' : 'none';
    q('#oBox').style.display = cat === 'other' ? '' : 'none';
    q('#amt').placeholder = cat === 'fuel' ? 'المجموع (يُحسب تلقائياً)' : 'المبلغ';
    root.querySelectorAll('.cat').forEach(b => b.classList.toggle('on', b.dataset.c === cat));
  };
  root.querySelectorAll('.cat').forEach(b => b.onclick = () => { cat = b.dataset.c; showCat(); });

  // المجموع = سعر اللتر × عدد اللترات (تلقائياً، ويمكن تعديله يدوياً)
  const calc = () => {
    if (cat !== 'fuel') return;
    const p = num(q('#ppl').value), l = num(q('#ltr').value);
    if (p != null && l != null) q('#amt').value = fmtNum(p * l);
  };
  q('#ppl').oninput = calc; q('#ltr').oninput = calc;

  const setImg = async (n, f) => {
    if (!f) return;
    try {
      const b = await toB64(f);
      if (n === 1) b1 = b; else b2 = b;
      const pv = q('#pv' + n); pv.src = dataUrl(b); pv.style.display = 'block';
    } catch (e) { toast(e.message); }
  };
  [1, 2].forEach(n => {
    q('#c' + n).onclick = async () => setImg(n, await pickImage(true));
    q('#g' + n).onclick = async () => setImg(n, await pickImage(false));
  });

  q('#bSave').onclick = async () => {
    if (!b1) return toast('أرفق صورة الفاتورة (الصورة 1)');
    const o = { cat };
    let total = num(q('#amt').value), noteTxt;
    if (cat === 'fuel') {
      const p = num(q('#ppl').value), l = num(q('#ltr').value);
      if (p == null || p <= 0) return toast('أدخل سعر اللتر');
      if (l == null || l <= 0) return toast('أدخل عدد اللترات');
      if (total == null || total <= 0) total = p * l;
      o.ppl = fmtNum(p); o.liters = fmtNum(l);
      noteTxt = `بانزين — ${fmtNum(l)} لتر × ${fmtNum(p)}`;
    } else if (cat === 'maint') {
      const fl = q('#flt').value.trim();
      if (!fl) return toast('اكتب ما هو العطل');
      o.fault = fl; noteTxt = 'صيانة — ' + fl;
    } else noteTxt = q('#note').value.trim();
    const id = Date.now();
    o.id = id; o.note = noteTxt; o.time = id; o.file = 'inv_' + id;
    o.amount = total != null ? fmtNum(total) : q('#amt').value.trim();
    try {
      await imgSet('inv_' + id, b1);
      if (b2) { await imgSet('inv_' + id + '_2', b2); o.file2 = 'inv_' + id + '_2'; }
    } catch (e) { return toast(e.message); }
    D.invoices.push(o); saveD();
    ['#ppl', '#ltr', '#flt', '#note', '#amt'].forEach(k => q(k).value = '');
    b1 = b2 = null; [1, 2].forEach(n => { const pv = q('#pv' + n); pv.removeAttribute('src'); pv.style.display = 'none'; });
    drawList(); autoSync();
  };

  async function drawList() {
    const list = q('#list'); let h = '';
    for (const o of [...D.invoices].reverse()) {
      const i1 = await imgGet('inv_' + o.id), i2 = o.file2 ? await imgGet('inv_' + o.id + '_2') : null;
      h += `<div class="inv"><div class="ims"><img src="${dataUrl(i1)}" alt="">${i2 ? `<img src="${dataUrl(i2)}" alt="">` : ''}</div><div class="tx">${invDetail(o)}\n${timeStr(o.time)}</div><button class="del" data-id="${o.id}">🗑</button></div>`;
    }
    list.innerHTML = h;
    list.querySelectorAll('.del').forEach(btn => btn.onclick = () => dlg({ msg: 'حذف هذه الفاتورة؟', ok: 'حذف',
      onOk: async () => { const id = +btn.dataset.id; await imgDel('inv_' + id); await imgDel('inv_' + id + '_2'); D.invoices = D.invoices.filter(i => i.id !== id); saveD(); drawList(); autoSync(); } }));
  }
  showCat(); drawList();
}

async function renderProfile() {
  const F = [['name', 'الاسم الكامل'], ['phone', 'رقم الهاتف'], ['carType', 'نوع السيارة (مثال: تويوتا هايلكس)'], ['model', 'الموديل (سنة الصنع)'], ['color', 'لون السيارة'], ['plate', 'رقم المركبة (اللوحة)'], ['vin', 'رقم الشاصي']];
  const av = await imgGet('avatar');
  const root = page(`<div class="lbl b" style="font-size:20px">بيانات السائق والمركبة</div>
    ${profileDone() ? '' : '<div class="lbl" style="font-size:14px">أكمل البيانات التالية للمتابعة (إجباري)</div>'}
    ${F.map(([k, ph]) => `<input data-k="${k}" placeholder="${esc(ph)}" value="${esc(prof(k) || (k === 'name' ? S.driverName : '') || '')}" ${k === 'phone' ? 'type="tel"' : ''}>`).join('')}
    <div class="lbl b">الصورة الشخصية</div>
    <img id="pv" class="avatar" src="${dataUrl(av)}" style="${av ? '' : 'display:none'}" alt="">
    <button class="btn" id="bCam">📷 التقاط صورتي</button><button class="btn" id="bGal">🖼 اختيار صورتي من المعرض</button>
    <button class="btn" id="bSave">حفظ ومتابعة</button>`);
  const setAv = async f => { if (!f) return; try { await saveAvatar(f); $('#pv').src = dataUrl(await imgGet('avatar')); $('#pv').style.display = 'block'; } catch (e) { toast(e.message); } };
  root.querySelector('#bCam').onclick = async () => setAv(await pickImage(true));
  root.querySelector('#bGal').onclick = async () => setAv(await pickImage(false));
  root.querySelector('#bSave').onclick = () => {
    const ins = [...root.querySelectorAll('[data-k]')];
    ins.forEach(i => i.classList.remove('err'));
    for (const i of ins) if (!i.value.trim()) { i.classList.add('err'); i.focus(); return toast('مطلوب'); }
    if (!S.hasAvatar) return toast('التقط صورتك الشخصية أو اخترها');
    ins.forEach(i => S['p_' + i.dataset.k] = i.value.trim()); saveS();
    autoSync(); toast('تم حفظ البيانات ✓'); go('trip');
  };
}
async function saveAvatar(f) {
  const b64 = await toB64(f, { square: 256, q: .8 });
  await imgSet('avatar', b64); S.hasAvatar = true; S.photoTime = Date.now(); S.photoUp = false; saveS();
}

/* ===== تبويب الحساب والمزامنة ===== */
async function renderSync() {
  const av = await imgGet('avatar');
  const root = page(`<div class="lbl b" style="font-size:20px">الحساب</div>
    ${av ? `<img id="pv" class="avatar" style="width:96px;height:96px" src="${dataUrl(av)}" alt="">` : ''}
    <button class="btn" id="bCam">📷 التقاط صورتي</button><button class="btn" id="bGal">🖼 اختيار صورتي من المعرض</button>
    <button class="btn" id="bProf">✏ بيانات السائق والمركبة</button>
    <div class="lbl" style="font-size:17px">السائق: ${esc(S.driverName)}</div>
    <div class="lbl" style="font-size:17px">المركبة: ${esc(S.vehicle || 'غير محددة')}</div>
    <div class="lbl" style="font-size:15px">اسم المستخدم: ${esc(S.username)}</div>
    <button class="btn" id="bSync">مزامنة الآن</button><button class="btn" id="bOut">تسجيل الخروج</button>
    <div class="lbl" id="stat"></div>
    <div class="lbl" style="font-size:13px">يعمل التطبيق بدون إنترنت: كل شيء يُحفظ على الهاتف ويُرسل تلقائياً عند توفر الاتصال. على الآيفون يتم الإرسال أثناء فتح التطبيق، فافتحه مرة بعد عودة الإنترنت للتأكد من وصول كل البيانات.</div>`);
  const stat = root.querySelector('#stat');
  const setAv = async f => { if (!f) return; try { await saveAvatar(f); autoSync(); renderSync(); } catch (e) { toast(e.message); } };
  root.querySelector('#bCam').onclick = async () => setAv(await pickImage(true));
  root.querySelector('#bGal').onclick = async () => setAv(await pickImage(false));
  root.querySelector('#bProf').onclick = () => go('profile');
  root.querySelector('#bSync').onclick = () => { stat.textContent = 'جارٍ المزامنة...'; runSync(true, m => stat.textContent = m); };
  root.querySelector('#bOut').onclick = () => dlg({ msg: 'ستُرسل بياناتك أولاً ثم تُحذف من هذا الهاتف. متابعة؟', ok: 'خروج',
    onOk: () => { stat.textContent = 'جارٍ المزامنة قبل الخروج...';
      runSync(true, async m => {
        if (m.includes('✓')) await logout();
        else if (authGone) dlg({ title: 'الحساب غير موجود', ok: 'خروج بدون إرسال', cancel: 'إلغاء',
          msg: `${GONE_MSG}\n\nإن خرجت الآن سيُحذف من هذا الهاتف ما لم يُرسل (${pendingChanges()} تعديل، ${pendingInvoices()} فاتورة). متابعة؟`,
          onOk: () => { logout(); } });
        else stat.textContent = 'لم يتم الخروج: ' + m;
      }); } });
}
async function logout() {
  await imgClear(); localStorage.removeItem('fleet_s'); localStorage.removeItem('fleet_d');
  S = {}; D = { points: [], invoices: [], deletions: [], trips: [] }; disabled = false; showLogin();
}

/* ===== تشغيل ===== */
if ('serviceWorker' in navigator) {
  const hadCtl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadCtl) applyUpdate(); });
  addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    const chk = () => reg.update().catch(() => {});
    chk(); setInterval(chk, 5 * 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') chk(); });
    addEventListener('online', chk);
  }).catch(() => {}));
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if (configured()) { hideLogin(); go('trip'); kick(); } else showLogin();
</script>
</body>
</html>
